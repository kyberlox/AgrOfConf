server{
    #listen 443 ssl;
    listen 80;
    server_name _ ${NGINX_HOST};

    #ssl_certificate /etc/nginx/conf.d/ssl/intranet.emk.ru.crt;
    #ssl_certificate_key /etc/nginx/conf.d/ssl/intranet.emk.ru.key;
    #ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    #ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 1024M;

    location / {
       proxy_pass http://frontend:5173;
       proxy_read_timeout     360;
       proxy_connect_timeout  360;
       proxy_redirect         off;

        #Allow the use of websockets
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
    # location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:5173';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Accept, Authorization, Location, Allow, Content-Disposition, Sec-Fetch-Dest, Access-Control-Allow-Credentials, session_id';
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Length' 0;          
            # add_header 'Content-Length' 0;
            #add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        # Обычные запросы (GET, POST, …)
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept' always;

        proxy_pass http://fastapi:8000;
        proxy_read_timeout 1200;
        proxy_connect_timeout 600;
        proxy_redirect off;

        # Allow the use of websockets
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Дополнительно можно всё равно добавлять заголовки CORS (для надёжности)
        # add_header 'Access-Control-Allow-Origin' '*' always;
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    }
}