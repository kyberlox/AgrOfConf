services:

  nginx:
    image: nginx:1.27.0-alpine
    container_name: nginx_app_1
    depends_on:
      - fastapi
      #- frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_HOST=${DOMAIN}
    volumes:
      - ./nginx/:/etc/nginx/conf.d/
      - ./app_logs/nginx:/var/log/nginx  # Логи nginx
    networks:
      - app-network

  postgres:
    image: postgres:18.1-bookworm
    container_name: postgres_1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${user}
      POSTGRES_PASSWORD: ${pswd}
    volumes:
      - ./postgresql/data:/var/lib/postgresql
      - ./app_logs/postgres:/var/log/postgresql  # Логи PostgreSQL
    ports:
      - "127.0.0.1:5432:5432"
      # - 5432:5432
    networks:
      - app-network
  
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      #- "6379:6379"
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis_data:/data
      # - ./app_logs/redis:/var/log/redis  # Добавляем, если redis настроен писать логи в файл
    environment:
      - REDIS_PASSWORD=${pswd}  # пароль из .env
    command: [ "redis-server", "--requirepass", "${pswd}" ]
    restart: unless-stopped
    networks:
      - app-network

  fastapi:
    build: ./app
    container_name: fastapi_1
    volumes:
      - ./app:/data/app
      - ./uploads:/data/uploads
    env_file:
      - .env
    environment:
      # Наблюдаемость: трейсы -> OTel Collector -> Tempo; логи -> Elasticsearch
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      - OTEL_SERVICE_NAME=agrof-conf-api
      - ES_HOST=${ES_HOST:-http://elasticsearch:9200}
      - LOG_DATA_STREAM=${LOG_DATA_STREAM:-logs-agrof.app-default}
      - LOG_RETENTION=${LOG_RETENTION:-30d}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
      #- "8000:8000"
    depends_on:
      - postgres
      - elasticsearch
      - otel-collector
    networks:
      - app-network

  frontend:
    build:
      context: ./front
      args:
        # Относительный '/api' — запросы идут через Nginx на FastAPI.
        VITE_API_URL: /api
    container_name: frontend
    ports:
      #- "127.0.0.1:5173:5173"
      - "5173:5173"
    # environment:
      # - API_URL = http://${DOMAIN}/api

    networks:
      - app-network
# RJasd
  elasticsearch:
    image: elasticsearch:9.1.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      # ВНИМАНИЕ: security ОТКЛЮЧЕНА для локального тестирования,
      # чтобы бэкенд мог подключиться без пароля (см. el_connect.py).
      - xpack.security.enabled=false
      - network.host=0.0.0.0
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"  
      - "9300:9300" 
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: prometheus
    volumes:
      - ./app/Observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - app-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./app/Observability/otel/config.yaml:/etc/otel/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - tempo
    networks:
      - app-network

  tempo:
    image: grafana/tempo:2.7.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./app/Observability/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      # - "127.0.0.1:4317:4317"
      # - "127.0.0.1:4318:4318"
      - "127.0.0.1:3200:3200"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${pswd}
    volumes:
      - ./app/Observability/grafana/provisioning:/etc/grafana/provisioning
      - ./app/Observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - app-network

volumes:
  elasticsearch-data:
  prometheus-data:
  tempo-data:
  grafana-data:

networks:
  app-network:
    driver: bridge