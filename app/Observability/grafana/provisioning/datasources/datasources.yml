apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    uid: tempo-ds-uid
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      tracesToLogs:
        datasourceUid: elastic-ds-uid
        tags: ["trace_id"]

  - name: Elasticsearch
    uid: elastic-ds-uid
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: logs-agrof.*
    jsonData:
      timeField: "@timestamp"
      esVersion: "9.0.0"
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"([a-f0-9]{32})"'
          url: "$${__value.raw}"
          datasourceUid: tempo-ds-uid